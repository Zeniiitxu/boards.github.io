<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>CineMania | Indian Cinema + Hollywood</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e50914;
      --bg: #0a0a0a;
      --card: #141414;
      --surface: #1f1f1f;
      --text: #ffffff;
      --text-secondary: #b3b3b3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 15px 40px;
      transition: all 0.4s;
    }
    .header.scrolled { background: rgba(10,10,10,0.98); backdrop-filter: blur(12px); }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #e50914, #ff9933);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Playfair Display', serif;
    }

    .nav-links a {
      color: #ddd;
      margin: 0 18px;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: white; }

    /* Hero */
    .hero {
      height: 92vh;
      min-height: 650px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      position: relative;
      padding: 0 40px 120px;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(10,10,10,0.85) 75%, var(--bg) 100%);
    }

    .hero-content {
      max-width: 650px;
      position: relative;
      z-index: 2;
    }

    .hero-title {
      font-size: 4.2rem;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-play {
      background: white;
      color: black;
    }
    .btn-play:hover { background: #e50914; color: white; transform: scale(1.05); }

    /* Carousel */
    .carousel-container {
      position: relative;
      margin-bottom: 40px;
    }

    .carousel {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 0;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar { display: none; }

    .card {
      min-width: 190px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.08) translateY(-8px);
      z-index: 10;
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
      background: var(--card);
    }

    /* Other styles remain similar but cleaned up */
    .section { padding: 40px 40px 20px; max-width: 1400px; margin: 0 auto; }
    .section-title { font-size: 1.8rem; margin-bottom: 20px; font-weight: 700; }
  </style>
</head>
<body>

<header class="header" id="header">
  <div class="header-content">
    <div style="display:flex; align-items:center; gap:40px;">
      <div class="logo">CINEMANIA</div>
      <div class="nav-links">
        <a href="#" onclick="showHome()" class="active">Home</a>
        <a href="#" onclick="switchCategory('bollywood')">Bollywood</a>
        <a href="#" onclick="switchCategory('tollywood')">Tollywood</a>
        <a href="#" onclick="switchCategory('hollywood')">Hollywood</a>
        <a href="#" onclick="switchCategory('tv')">TV Shows</a>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:20px;">
      <input type="text" id="searchInput" placeholder="Search titles..." 
             style="background:#1f1f1f; border:none; padding:10px 16px; border-radius:8px; width:280px; color:white;"
             onkeyup="handleSearch(this.value)">
      <div onclick="toggleProfile()" style="cursor:pointer; width:38px; height:38px; background:#e50914; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">A</div>
    </div>
  </div>
</header>

<!-- Hero -->
<div class="hero" id="hero">
  <div class="hero-content">
    <h1 class="hero-title" id="heroTitle">JAWAN</h1>
    <p id="heroOverview" style="color:#ddd; margin:16px 0; font-size:1.1rem;"></p>
    <div class="hero-buttons">
      <button class="btn btn-play" onclick="playFeatured()">▶ Play Now</button>
      <button class="btn" style="background:rgba(255,255,255,0.15); color:white;" onclick="showMoreInfo()">More Info</button>
    </div>
  </div>
</div>

<main id="mainContent">
  <!-- Trending -->
  <div class="section">
    <h2 class="section-title">🔥 Trending Now</h2>
    <div class="carousel-container">
      <div class="carousel" id="trendingCarousel"></div>
    </div>
  </div>

  <!-- Other sections with carousels -->
  <div class="section">
    <h2 class="section-title">🇮🇳 Latest Bollywood</h2>
    <div class="carousel-container">
      <div class="carousel" id="bollywoodCarousel"></div>
    </div>
  </div>
</main>

<script>
// Same TMDB config as before, but with better UI functions

async function createCarousel(gridId, items, type = 'movie') {
  const container = document.getElementById(gridId);
  container.innerHTML = '';
  
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w342${item.poster_path}" 
           onerror="this.src='https://placehold.co/342x513/1a1a1a/666?text=No+Image'">
      <div class="card-info">
        <div style="font-weight:600; font-size:0.95rem;">${item.title || item.name}</div>
        <div style="font-size:0.8rem; color:#888;">${(item.release_date || item.first_air_date || '').slice(0,4)}</div>
      </div>
    `;
    card.onclick = () => openPlayer(item.id, type, item);
    container.appendChild(card);
  });
}

}

// Add scroll effect to header
window.addEventListener('scroll', () => {
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 100);
});
</script>
</body>
</html>
