<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>CineVault | Ad-Free Movie Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #e50914;
      --primary-dark: #b20710;
      --bg-dark: #0a0a0a;
      --bg-card: #141414;
      --bg-surface: #1a1a1a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-muted: #6b6b6b;
      --border: rgba(255,255,255,0.1);
      --success: #00e676;
      --warning: #ffc107;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-dark);
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 100%);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 40px;
      transition: all 0.3s ease;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, #ff4d4d 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      text-decoration: none;
      font-family: 'Playfair Display', serif;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-primary);
    }

    .nav-link.active {
      position: relative;
    }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .search-container {
      flex: 1;
      max-width: 400px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      gap: 10px;
      transition: all 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(229,9,20,0.2);
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      flex-shrink: 0;
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 85vh;
      min-height: 600px;
      display: flex;
      align-items: flex-end;
      padding: 0 40px 80px 40px;
      margin-top: 60px;
      background-size: cover;
      background-position: center 20%;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, var(--bg-dark) 0%, transparent 50%, transparent 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }

    .hero-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 800;
      font-family: 'Playfair Display', serif;
      margin-bottom: 16px;
      line-height: 1.1;
    }

    .hero-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .hero-rating {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hero-rating svg {
      width: 16px;
      height: 16px;
      fill: #ffc107;
    }

    .hero-overview {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
    }

    .btn-play, .btn-info {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    .btn-play {
      background: var(--primary);
      color: white;
    }

    .btn-play:hover {
      background: var(--primary-dark);
      transform: scale(1.02);
    }

    .btn-info {
      background: rgba(255,255,255,0.1);
      color: white;
      backdrop-filter: blur(10px);
    }

    .btn-info:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Sections */
    .section {
      padding: 40px 40px 0 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }

    .section-title span {
      color: var(--primary);
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    /* Movie Card */
    .movie-card {
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-card);
    }

    .movie-card:hover {
      transform: scale(1.05);
      z-index: 10;
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-year {
      font-size: 12px;
      color: var(--text-muted);
    }

    .movie-rating {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--warning);
    }

    .movie-type {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* Modal Player */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: var(--primary);
    }

    .player-container {
      position: relative;
      padding-top: 56.25%;
      background: black;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-footer {
      padding: 16px 24px;
      font-size: 13px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }

    /* TV Episode Controls */
    .episode-controls {
      display: none;
      padding: 16px 24px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .episode-controls.show {
      display: flex;
    }

    .season-select {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .episode-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .episode-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .episode-btn:hover, .episode-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Loading Skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-surface) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-poster {
      width: 100%;
      aspect-ratio: 2/3;
    }

    /* Loading Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 12px 20px;
      }
      .header-content {
        flex-wrap: wrap;
        gap: 15px;
      }
      .search-container {
        order: 3;
        max-width: 100%;
        width: 100%;
      }
      .hero {
        padding: 0 20px 60px 20px;
        margin-top: 120px;
      }
      .hero-title {
        font-size: 32px;
      }
      .section {
        padding: 30px 20px 0 20px;
      }
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      .modal {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <a class="logo" href="#" onclick="showHome()">CINE<span style="color:var(--primary)">VAULT</span></a>
    <div class="nav-links">
      <a class="nav-link active" onclick="switchTab('movie')">Movies</a>
      <a class="nav-link" onclick="switchTab('tv')">TV Shows</a>
      <a class="nav-link" onclick="switchTab('trending')">Trending</a>
    </div>
    <div class="search-container">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search movies, TV shows..." oninput="handleSearch(this.value)">
      </div>
    </div>
  </div>
</header>

<!-- Hero Section -->
<div id="heroContainer">
  <div class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge">NOW STREAMING</div>
      <h1 class="hero-title" id="heroTitle">Loading...</h1>
      <div class="hero-meta">
        <span id="heroYear"></span>
        <span class="hero-rating" id="heroRating">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <span></span>
        </span>
        <span id="heroRuntime"></span>
      </div>
      <p class="hero-overview" id="heroOverview"></p>
      <div class="hero-buttons">
        <button class="btn-play" id="heroPlayBtn">▶ Watch Now</button>
        <button class="btn-info" id="heroInfoBtn">ℹ More Info</button>
      </div>
    </div>
  </div>
</div>

<!-- Main Content -->
<main id="mainContent">
  <!-- Home View -->
  <div id="homeView">
    <!-- Trending Section -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">🔥 Trending <span>Now</span></h2>
      </div>
      <div class="movie-grid" id="trendingGrid"></div>
    </div>

    <!-- Popular Movies -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">🎬 Popular <span>Movies</span></h2>
      </div>
      <div class="movie-grid" id="popularMoviesGrid"></div>
    </div>

    <!-- Popular TV Shows -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">📺 Popular <span>TV Shows</span></h2>
      </div>
      <div class="movie-grid" id="popularTVGrid"></div>
    </div>
  </div>

  <!-- Category View -->
  <div id="categoryView" style="display: none;">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title" id="categoryTitle"></h2>
      </div>
      <div class="movie-grid" id="categoryGrid"></div>
    </div>
  </div>

  <!-- Search View -->
  <div id="searchView" style="display: none;">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Search Results for "<span id="searchTerm"></span>"</h2>
      </div>
      <div class="movie-grid" id="searchGrid"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>CineVault | Ad-Free Streaming Platform</p>
  <p>Powered by VidKing API & TMDB</p>
</footer>

<!-- Player Modal -->
<div class="modal" id="playerModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">—</span>
      <button class="modal-close" onclick="closePlayer()">✕</button>
    </div>
    <div class="player-container" id="playerContainer">
      <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="modal-footer" id="modalFooter">
      <span id="modalYear"></span> • <span id="modalRating"></span> • <span id="modalOverview"></span>
    </div>
    <div class="episode-controls" id="episodeControls">
      <select class="season-select" id="seasonSelect" onchange="changeSeason()"></select>
      <div class="episode-list" id="episodeList"></div>
    </div>
  </div>
</div>

<script>
  // ============================================
  // CONFIGURATION
  // ============================================
  const TMDB_API_KEY = '2dca580c2a14b55200e784d157207b4d';
  const TMDB_BASE = 'https://api.themoviedb.org/3';
  const IMAGE_BASE = 'https://image.tmdb.org/t/p/';
  
  // VidKing API endpoints (ad-free, no popups)
  const VIDKING_EMBED = 'https://www.vidking.net/embed';
  
  // State
  let currentMedia = null;
  let currentSeason = 1;
  let currentEpisode = 1;
  let currentCategory = 'movie';
  let searchTimeout = null;
  
  // ============================================
  // API HELPERS
  // ============================================
  async function fetchTMDB(endpoint, params = {}) {
    try {
      const queryParams = new URLSearchParams({
        api_key: TMDB_API_KEY,
        ...params
      });
      const response = await fetch(`${TMDB_BASE}${endpoint}?${queryParams}`);
      if (!response.ok) throw new Error('API request failed');
      return await response.json();
    } catch (error) {
      console.error('TMDB Error:', error);
      return { results: [] };
    }
  }
  
  function getImageUrl(path, size = 'w342') {
    return path ? `${IMAGE_BASE}${size}${path}` : null;
  }
  
  // ============================================
  // UI COMPONENTS
  // ============================================
  function createMovieCard(item, type) {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.onclick = () => openPlayer(item.id, type, item);
    
    const title = type === 'movie' ? item.title : item.name;
    const year = type === 'movie' 
      ? (item.release_date || '').slice(0, 4) 
      : (item.first_air_date || '').slice(0, 4);
    const poster = getImageUrl(item.poster_path);
    const rating = item.vote_average ? item.vote_average.toFixed(1) : null;
    
    card.innerHTML = `
      ${poster 
        ? `<img class="movie-poster" src="${poster}" alt="${title}" loading="lazy" 
            onerror="this.src='https://placehold.co/342x513/1a1a1a/666?text=${encodeURIComponent(title)}'">`
        : `<div class="movie-poster skeleton" style="display:flex;align-items:center;justify-content:center;background:#1a1a1a;">
            <span style="color:#666">No Poster</span>
           </div>`
      }
      ${rating ? `<div class="movie-rating">★ ${rating}</div>` : ''}
      <div class="movie-type">${type === 'movie' ? 'MOVIE' : 'TV'}</div>
      <div class="movie-info">
        <div class="movie-title">${escapeHtml(title)}</div>
        <div class="movie-year">${year || 'N/A'}</div>
      </div>
    `;
    
    return card;
  }
  
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  function showSkeletons(gridId, count = 8) {
    const grid = document.getElementById(gridId);
    if (!grid) return;
    grid.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const skeleton = document.createElement('div');
      skeleton.className = 'skeleton skeleton-poster';
      grid.appendChild(skeleton);
    }
  }
  
  // ============================================
  // LOAD CONTENT
  // ============================================
  async function loadHero() {
    const data = await fetchTMDB('/trending/movie/week');
    if (!data.results || data.results.length === 0) return;
    
    const heroMovie = data.results[Math.floor(Math.random() * Math.min(5, data.results.length))];
    const backdrop = getImageUrl(heroMovie.backdrop_path, 'original');
    
    if (backdrop) {
      document.getElementById('hero').style.backgroundImage = `url(${backdrop})`;
      document.getElementById('hero').style.backgroundSize = 'cover';
      document.getElementById('hero').style.backgroundPosition = 'center 20%';
    }
    
    document.getElementById('heroTitle').textContent = heroMovie.title;
    document.getElementById('heroOverview').textContent = heroMovie.overview || 'No description available.';
    document.getElementById('heroYear').textContent = (heroMovie.release_date || '').slice(0, 4) || 'N/A';
    
    const ratingSpan = document.querySelector('#heroRating span');
    if (ratingSpan) ratingSpan.textContent = heroMovie.vote_average ? heroMovie.vote_average.toFixed(1) : 'N/A';
    
    // Get runtime for movies
    if (heroMovie.id) {
      const details = await fetchTMDB(`/movie/${heroMovie.id}`);
      const runtime = details.runtime ? `${details.runtime} min` : '';
      document.getElementById('heroRuntime').textContent = runtime;
    }
    
    document.getElementById('heroPlayBtn').onclick = () => openPlayer(heroMovie.id, 'movie', heroMovie);
    document.getElementById('heroInfoBtn').onclick = () => openPlayer(heroMovie.id, 'movie', heroMovie);
  }
  
  async function loadHome() {
    showSkeletons('trendingGrid', 8);
    showSkeletons('popularMoviesGrid', 8);
    showSkeletons('popularTVGrid', 8);
    
    const [trending, popularMovies, popularTV] = await Promise.all([
      fetchTMDB('/trending/all/week'),
      fetchTMDB('/movie/popular'),
      fetchTMDB('/tv/popular')
    ]);
    
    // Render Trending
    const trendingGrid = document.getElementById('trendingGrid');
    trendingGrid.innerHTML = '';
    (trending.results || []).slice(0, 8).forEach(item => {
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      trendingGrid.appendChild(createMovieCard(item, type));
    });
    
    // Render Popular Movies
    const moviesGrid = document.getElementById('popularMoviesGrid');
    moviesGrid.innerHTML = '';
    (popularMovies.results || []).slice(0, 8).forEach(item => {
      moviesGrid.appendChild(createMovieCard(item, 'movie'));
    });
    
    // Render Popular TV
    const tvGrid = document.getElementById('popularTVGrid');
    tvGrid.innerHTML = '';
    (popularTV.results || []).slice(0, 8).forEach(item => {
      tvGrid.appendChild(createMovieCard(item, 'tv'));
    });
  }
  
  async function switchTab(tab) {
    currentCategory = tab;
    
    // Update active nav
    document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
    event.target.classList.add('active');
    
    // Hide/show views
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('categoryView').style.display = 'block';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('heroContainer').style.display = 'none';
    
    // Set title
    const titles = {
      movie: '🎬 Popular Movies',
      tv: '📺 Popular TV Shows',
      trending: '🔥 Trending Now'
    };
    document.getElementById('categoryTitle').innerHTML = titles[tab];
    
    // Load content
    const grid = document.getElementById('categoryGrid');
    showSkeletons('categoryGrid', 16);
    
    let data;
    if (tab === 'movie') data = await fetchTMDB('/movie/popular');
    else if (tab === 'tv') data = await fetchTMDB('/tv/popular');
    else data = await fetchTMDB('/trending/all/week');
    
    grid.innerHTML = '';
    (data.results || []).forEach(item => {
      const type = tab === 'movie' ? 'movie' : (tab === 'tv' ? 'tv' : (item.media_type === 'tv' ? 'tv' : 'movie'));
      grid.appendChild(createMovieCard(item, type));
    });
  }
  
  function showHome() {
    document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
    document.querySelector('.nav-link').classList.add('active');
    
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('categoryView').style.display = 'none';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('heroContainer').style.display = 'block';
    document.getElementById('searchInput').value = '';
  }
  
  // ============================================
  // SEARCH
  // ============================================
  function handleSearch(query) {
    clearTimeout(searchTimeout);
    if (!query.trim()) {
      showHome();
      return;
    }
    searchTimeout = setTimeout(() => performSearch(query.trim()), 400);
  }
  
  async function performSearch(query) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('categoryView').style.display = 'none';
    document.getElementById('heroContainer').style.display = 'none';
    document.getElementById('searchView').style.display = 'block';
    document.getElementById('searchTerm').textContent = query;
    
    const grid = document.getElementById('searchGrid');
    showSkeletons('searchGrid', 12);
    
    const data = await fetchTMDB('/search/multi', { query, include_adult: false });
    
    grid.innerHTML = '';
    const results = (data.results || []).filter(r => r.media_type !== 'person' && (r.poster_path || r.title || r.name));
    
    if (results.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No results found</div>';
      return;
    }
    
    results.forEach(item => {
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      grid.appendChild(createMovieCard(item, type));
    });
  }
  
  // ============================================
  // PLAYER - VidKing API (Ad-Free)
  // ============================================
  function getVidKingUrl(type, id, season = null, episode = null) {
    if (type === 'movie') {
      return `${VIDKING_EMBED}/movie/${id}`;
    } else {
      return `${VIDKING_EMBED}/tv/${id}/${season}/${episode}`;
    }
  }
  
  async function openPlayer(id, type, item) {
    currentMedia = { id, type, title: type === 'movie' ? item.title : item.name, item };
    currentSeason = 1;
    currentEpisode = 1;
    
    // Set modal info
    document.getElementById('modalTitle').textContent = type === 'movie' ? item.title : item.name;
    document.getElementById('modalYear').textContent = (type === 'movie' ? item.release_date : item.first_air_date || '').slice(0, 4) || 'N/A';
    document.getElementById('modalRating').textContent = item.vote_average ? `★ ${item.vote_average.toFixed(1)}` : '★ N/A';
    document.getElementById('modalOverview').textContent = (item.overview || 'No description available.').slice(0, 200);
    
    // Set iframe source
    const playerFrame = document.getElementById('playerFrame');
    
    if (type === 'movie') {
      document.getElementById('episodeControls').classList.remove('show');
      playerFrame.src = getVidKingUrl('movie', id);
    } else {
      document.getElementById('episodeControls').classList.add('show');
      await loadTVSeasons(id);
      playerFrame.src = getVidKingUrl('tv', id, currentSeason, currentEpisode);
    }
    
    // Show modal
    document.getElementById('playerModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  
  async function loadTVSeasons(tvId) {
    try {
      const details = await fetchTMDB(`/tv/${tvId}`);
      const seasons = (details.seasons || []).filter(s => s.season_number > 0);
      
      const seasonSelect = document.getElementById('seasonSelect');
      seasonSelect.innerHTML = seasons.map(s => 
        `<option value="${s.season_number}">Season ${s.season_number} (${s.episode_count} episodes)</option>`
      ).join('');
      
      await loadEpisodes(tvId, 1);
    } catch (error) {
      console.error('Error loading seasons:', error);
    }
  }
  
  async function loadEpisodes(tvId, season) {
    currentSeason = season;
    try {
      const seasonData = await fetchTMDB(`/tv/${tvId}/season/${season}`);
      const episodes = seasonData.episodes || [];
      
      const episodeList = document.getElementById('episodeList');
      episodeList.innerHTML = '';
      
      episodes.slice(0, 30).forEach((ep, index) => {
        const btn = document.createElement('button');
        btn.className = 'episode-btn' + (index + 1 === currentEpisode ? ' active' : '');
        btn.textContent = `E${ep.episode_number}`;
        btn.onclick = () => {
          document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEpisode = ep.episode_number;
          document.getElementById('playerFrame').src = getVidKingUrl('tv', tvId, currentSeason, currentEpisode);
        };
        episodeList.appendChild(btn);
      });
    } catch (error) {
      console.error('Error loading episodes:', error);
    }
  }
  
  async function changeSeason() {
    const season = parseInt(document.getElementById('seasonSelect').value);
    if (!currentMedia) return;
    currentSeason = season;
    currentEpisode = 1;
    await loadEpisodes(currentMedia.id, season);
    document.getElementById('playerFrame').src = getVidKingUrl('tv', currentMedia.id, currentSeason, currentEpisode);
  }
  
  function closePlayer() {
    document.getElementById('playerModal').classList.remove('active');
    document.getElementById('playerFrame').src = '';
    document.body.style.overflow = '';
  }
  
  // Close on escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePlayer();
  });
  
  // Close modal when clicking background
  document.getElementById('playerModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('playerModal')) closePlayer();
  });
  
  // ============================================
  // INIT
  // ============================================
  loadHero();
  loadHome();
</script>
</body>
</html>
