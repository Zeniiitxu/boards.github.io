<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineFlix - Stream Movies & TV Shows</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 100%);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 16px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #e50914, #ff4d4d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }

    .nav {
      display: flex;
      gap: 30px;
    }

    .nav a {
      color: #b3b3b3;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav a:hover, .nav a.active {
      color: white;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 16px;
      gap: 8px;
    }

    .search-box input {
      background: none;
      border: none;
      color: white;
      font-size: 14px;
      width: 220px;
      outline: none;
    }

    .search-box input::placeholder {
      color: #666;
    }

    /* Hero */
    .hero {
      position: relative;
      height: 85vh;
      min-height: 550px;
      margin-top: 70px;
      display: flex;
      align-items: flex-end;
      padding: 0 40px 80px;
      background-size: cover;
      background-position: center 20%;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #0f0f0f 0%, transparent 50%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }

    .hero-badge {
      background: #e50914;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.1;
    }

    .hero-meta {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #b3b3b3;
      margin-bottom: 20px;
    }

    .hero-rating {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hero-overview {
      color: #b3b3b3;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn-play {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s;
    }

    .btn-play:hover {
      transform: scale(1.02);
      background: #b20710;
    }

    /* Sections */
    .section {
      padding: 40px 40px 0;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
    }

    .section-title span {
      color: #e50914;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .movie-card {
      cursor: pointer;
      transition: transform 0.3s;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1a1a;
    }

    .movie-card:hover {
      transform: scale(1.05);
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-year {
      font-size: 12px;
      color: #666;
    }

    .movie-rating {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #ffc107;
    }

    .movie-card {
      position: relative;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 90%;
      max-width: 1100px;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%;
      background: black;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-info {
      padding: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      background: rgba(0,0,0,0.8);
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 3px solid #333;
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .footer {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 12px;
      border-top: 1px solid #1a1a1a;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .header {
        padding: 12px 20px;
      }
      .header-content {
        flex-wrap: wrap;
      }
      .search-box {
        order: 3;
        width: 100%;
      }
      .search-box input {
        width: 100%;
      }
      .hero-title {
        font-size: 32px;
      }
      .section {
        padding: 30px 20px 0;
      }
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
    }

    .skeleton {
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-poster {
      width: 100%;
      aspect-ratio: 2/3;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <a class="logo" href="#" onclick="showHome()">CINEFLIX</a>
    <div class="nav">
      <a class="active" onclick="showHome()">Home</a>
      <a onclick="loadCategory('movie')">Movies</a>
      <a onclick="loadCategory('tv')">TV Shows</a>
      <a onclick="loadCategory('trending')">Trending</a>
    </div>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search movies, shows..." onkeyup="handleSearch(this.value)">
    </div>
  </div>
</header>

<!-- Hero Section -->
<div id="heroSection">
  <div class="hero" id="hero" style="background-size: cover;">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge">🔥 TRENDING NOW</div>
      <h1 class="hero-title" id="heroTitle">Loading...</h1>
      <div class="hero-meta">
        <span id="heroYear"></span>
        <span class="hero-rating" id="heroRating">★ <span></span></span>
      </div>
      <p class="hero-overview" id="heroOverview"></p>
      <button class="btn-play" id="heroPlayBtn">▶ Watch Now</button>
    </div>
  </div>
</div>

<!-- Main Content -->
<main id="mainContent">
  <div id="homeView">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">🔥 Trending <span>Now</span></h2>
      </div>
      <div class="movie-grid" id="trendingGrid"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">🎬 Popular <span>Movies</span></h2>
      </div>
      <div class="movie-grid" id="moviesGrid"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">📺 Popular <span>TV Shows</span></h2>
      </div>
      <div class="movie-grid" id="tvGrid"></div>
    </div>
  </div>

  <div id="categoryView" style="display: none;">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title" id="categoryTitle"></h2>
      </div>
      <div class="movie-grid" id="categoryGrid"></div>
    </div>
  </div>

  <div id="searchView" style="display: none;">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Search Results for "<span id="searchTerm"></span>"</h2>
      </div>
      <div class="movie-grid" id="searchGrid"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>CineFlix | Stream Movies & TV Shows for Free</p>
  <p>Powered by TMDB & VidKing</p>
</footer>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="video-wrapper">
      <iframe id="playerFrame" src="" allowfullscreen></iframe>
      <div class="loading-spinner" id="playerLoading" style="display: none;"></div>
    </div>
    <div class="modal-info">
      <div class="modal-title" id="modalTitle"></div>
      <div id="modalOverview" style="color: #b3b3b3; font-size: 13px; margin-top: 8px;"></div>
    </div>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
</div>

<script>
  // API Configuration
  const API_KEY = '2dca580c2a14b55200e784d157207b4d';
  const BASE_URL = 'https://api.themoviedb.org/3';
  const IMG_URL = 'https://image.tmdb.org/t/p/w342';
  const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';
  const VIDKING_URL = 'https://www.vidking.net/embed';

  let currentMedia = null;
  let searchTimeout = null;

  // Fetch from TMDB
  async function fetchAPI(endpoint, params = {}) {
    try {
      const query = new URLSearchParams({ api_key: API_KEY, ...params });
      const res = await fetch(`${BASE_URL}${endpoint}?${query}`);
      if (!res.ok) throw new Error('API error');
      return await res.json();
    } catch (error) {
      console.error('Fetch error:', error);
      return { results: [] };
    }
  }

  // Create movie card
  function createCard(item, type) {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.onclick = () => playMedia(item.id, type, item);
    
    const title = type === 'movie' ? item.title : item.name;
    const year = type === 'movie' 
      ? (item.release_date || '').slice(0, 4) 
      : (item.first_air_date || '').slice(0, 4);
    const poster = item.poster_path ? IMG_URL + item.poster_path : null;
    const rating = item.vote_average ? item.vote_average.toFixed(1) : null;
    
    card.innerHTML = `
      ${poster 
        ? `<img class="movie-poster" src="${poster}" alt="${title}" loading="lazy">`
        : `<div class="skeleton-poster" style="display:flex;align-items:center;justify-content:center;background:#1a1a1a;">📽️</div>`
      }
      ${rating ? `<div class="movie-rating">★ ${rating}</div>` : ''}
      <div class="movie-info">
        <div class="movie-title">${escapeHtml(title)}</div>
        <div class="movie-year">${year || '2024'}</div>
      </div>
    `;
    return card;
  }

  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function showSkeletons(gridId, count = 8) {
    const grid = document.getElementById(gridId);
    if (!grid) return;
    grid.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const skeleton = document.createElement('div');
      skeleton.className = 'skeleton-poster';
      skeleton.style.cssText = 'background:#1a1a1a; border-radius:8px; aspect-ratio:2/3;';
      grid.appendChild(skeleton);
    }
  }

  // Load home page
  async function loadHome() {
    showSkeletons('trendingGrid', 8);
    showSkeletons('moviesGrid', 8);
    showSkeletons('tvGrid', 8);

    const [trending, movies, tv] = await Promise.all([
      fetchAPI('/trending/all/week'),
      fetchAPI('/movie/popular'),
      fetchAPI('/tv/popular')
    ]);

    const trendingGrid = document.getElementById('trendingGrid');
    trendingGrid.innerHTML = '';
    (trending.results || []).slice(0, 8).forEach(item => {
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      trendingGrid.appendChild(createCard(item, type));
    });

    const moviesGrid = document.getElementById('moviesGrid');
    moviesGrid.innerHTML = '';
    (movies.results || []).slice(0, 8).forEach(item => {
      moviesGrid.appendChild(createCard(item, 'movie'));
    });

    const tvGrid = document.getElementById('tvGrid');
    tvGrid.innerHTML = '';
    (tv.results || []).slice(0, 8).forEach(item => {
      tvGrid.appendChild(createCard(item, 'tv'));
    });

    // Load hero with random trending movie
    if (trending.results && trending.results.length) {
      const heroItem = trending.results[Math.floor(Math.random() * 5)];
      updateHero(heroItem, heroItem.media_type === 'tv' ? 'tv' : 'movie');
    }
  }

  async function updateHero(item, type) {
    const title = type === 'movie' ? item.title : item.name;
    const year = type === 'movie' 
      ? (item.release_date || '').slice(0, 4) 
      : (item.first_air_date || '').slice(0, 4);
    
    document.getElementById('heroTitle').textContent = title;
    document.getElementById('heroOverview').textContent = item.overview || 'No description available.';
    document.getElementById('heroYear').textContent = year || '2024';
    const ratingSpan = document.querySelector('#heroRating span');
    if (ratingSpan) ratingSpan.textContent = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
    
    if (item.backdrop_path) {
      document.getElementById('hero').style.backgroundImage = `url(${BACKDROP_URL}${item.backdrop_path})`;
    }
    
    document.getElementById('heroPlayBtn').onclick = () => playMedia(item.id, type, item);
  }

  // Load category
  async function loadCategory(type) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('categoryView').style.display = 'block';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('heroSection').style.display = 'none';
    
    const titles = {
      movie: '🎬 Popular Movies',
      tv: '📺 Popular TV Shows',
      trending: '🔥 Trending Now'
    };
    document.getElementById('categoryTitle').innerHTML = titles[type] || type;
    
    const grid = document.getElementById('categoryGrid');
    showSkeletons('categoryGrid', 20);
    
    let data;
    if (type === 'movie') data = await fetchAPI('/movie/popular');
    else if (type === 'tv') data = await fetchAPI('/tv/popular');
    else data = await fetchAPI('/trending/all/week');
    
    grid.innerHTML = '';
    (data.results || []).forEach(item => {
      const itemType = type === 'movie' ? 'movie' : (type === 'tv' ? 'tv' : (item.media_type === 'tv' ? 'tv' : 'movie'));
      grid.appendChild(createCard(item, itemType));
    });
    
    // Update active nav
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    event.target.classList.add('active');
  }

  function showHome() {
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('categoryView').style.display = 'none';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('heroSection').style.display = 'block';
    
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    document.querySelector('.nav a').classList.add('active');
    
    loadHome();
  }

  // Search
  function handleSearch(query) {
    clearTimeout(searchTimeout);
    if (!query.trim()) {
      showHome();
      return;
    }
    searchTimeout = setTimeout(() => performSearch(query.trim()), 400);
  }

  async function performSearch(query) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('categoryView').style.display = 'none';
    document.getElementById('heroSection').style.display = 'none';
    document.getElementById('searchView').style.display = 'block';
    document.getElementById('searchTerm').textContent = query;
    
    const grid = document.getElementById('searchGrid');
    showSkeletons('searchGrid', 12);
    
    const data = await fetchAPI('/search/multi', { query, include_adult: false });
    
    grid.innerHTML = '';
    const results = (data.results || []).filter(r => r.media_type !== 'person' && (r.poster_path || r.title || r.name));
    
    if (results.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#666;padding:60px;">No results found for "' + escapeHtml(query) + '"</div>';
      return;
    }
    
    results.forEach(item => {
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      grid.appendChild(createCard(item, type));
    });
  }

  // Play media
  function playMedia(id, type, item) {
    currentMedia = { id, type, title: type === 'movie' ? item.title : item.name };
    
    document.getElementById('modalTitle').textContent = currentMedia.title;
    document.getElementById('modalOverview').textContent = item.overview || 'No description available.';
    
    const loading = document.getElementById('playerLoading');
    loading.style.display = 'flex';
    
    const iframe = document.getElementById('playerFrame');
    if (type === 'movie') {
      iframe.src = `${VIDKING_URL}/movie/${id}`;
    } else {
      iframe.src = `${VIDKING_URL}/tv/${id}/1/1`;
    }
    
    iframe.onload = () => {
      loading.style.display = 'none';
    };
    
    document.getElementById('modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('playerFrame').src = '';
    document.body.style.overflow = '';
  }

  // Close modal on escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // Close modal on background click
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  // Load watch history from localStorage
  function saveToHistory(media) {
    let history = JSON.parse(localStorage.getItem('watchHistory') || '[]');
    history = history.filter(h => h.id !== media.id);
    history.unshift({ ...media, watchedAt: Date.now() });
    if (history.length > 20) history.pop();
    localStorage.setItem('watchHistory', JSON.stringify(history));
  }

  // Initialize
  loadHome();
</script>
</body>
</html>
