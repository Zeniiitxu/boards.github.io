<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineVault — Stream Anything</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a26;
      --border: rgba(255,255,255,0.07);
      --accent: #e8b84b;
      --accent2: #c97d2e;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --red: #e84b4b;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* GRAIN OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--accent);
      text-decoration: none;
    }
    .logo span { color: var(--text); }

    nav { display: flex; gap: 6px; }
    .nav-btn {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* SEARCH */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 14px;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .search-bar:focus-within { border-color: var(--accent); }
    .search-bar svg { width: 15px; height: 15px; opacity: 0.4; flex-shrink: 0; }
    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      width: 200px;
      padding: 9px 0;
    }
    .search-bar input::placeholder { color: var(--muted); }

    /* HERO */
    .hero {
      position: relative;
      height: 520px;
      display: flex;
      align-items: flex-end;
      padding: 60px 40px;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a0f 0%, #151520 100%);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      filter: blur(2px) brightness(0.25);
      transition: opacity 0.8s;
    }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 0%, transparent 60%),
                  linear-gradient(to right, var(--bg) 0%, transparent 50%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 600px; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 3px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 6vw, 80px);
      line-height: 0.95;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
    .hero p {
      color: rgba(232,232,240,0.65);
      font-size: 14px;
      line-height: 1.7;
      max-width: 460px;
      margin-bottom: 24px;
    }
    .hero-actions { display: flex; gap: 12px; align-items: center; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      background: var(--accent);
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover { background: #f5c85a; transform: translateY(-1px); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.13); }
    .hero-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 16px;
    }
    .hero-meta span { display: flex; align-items: center; gap: 5px; }
    .rating-star { color: var(--accent); }

    /* SECTIONS */
    .section { padding: 40px 32px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--text);
    }
    .section-title span { color: var(--accent); }
    .see-all {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }
    .see-all:hover { color: var(--accent); }

    /* GRID */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    /* CARD */
    .card {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
      border: 1px solid var(--border);
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,184,75,0.3);
    }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,15,0.95) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.25s;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }
    .card:hover .card-overlay { opacity: 1; }
    .card-play {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-play svg { width: 14px; height: 14px; fill: #000; margin-left: 2px; }
    .card-info { padding: 10px 10px 10px; }
    .card-title {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-year { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .card-rating {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(10,10,15,0.8);
      border: 1px solid rgba(232,184,75,0.3);
      color: var(--accent);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
      backdrop-filter: blur(4px);
    }
    .card-type-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(10,10,15,0.8);
      color: var(--muted);
      font-size: 9px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* SKELETON */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-card { border-radius: 6px; aspect-ratio: 2/3; }

    /* PLAYER MODAL */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 1000px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      overflow: hidden;
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalIn { from { opacity:0; transform: scale(0.9) translateY(20px); } to { opacity:1; transform: none; } }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--text);
    }
    .modal-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      font-size: 18px;
    }
    .modal-close:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .player-wrap {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }
    .player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .modal-footer {
      padding: 14px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .modal-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; }
    .modal-meta span { display: flex; align-items: center; gap: 4px; }

    /* TV CONTROLS */
    .tv-controls {
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 0 20px 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .tv-controls.show { display: flex; }
    .tv-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .episode-btn {
      padding: 5px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .episode-btn:hover, .episode-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
    select.episode-select {
      padding: 5px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      outline: none;
    }

    /* SEARCH RESULTS */
    .search-results {
      padding: 32px;
    }
    .search-results-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: var(--muted);
    }
    .search-results-title span { color: var(--accent); }

    /* TABS */
    .type-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .type-tab {
      padding: 7px 18px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .type-tab.active { background: var(--accent); border-color: var(--accent); color: #000; }

    /* LOADING */
    .loading-spinner {
      display: flex;
      justify-content: center;
      padding: 60px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 32px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 40px 32px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      line-height: 2;
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .logo { font-size: 22px; }
      .search-bar input { width: 130px; }
      .section { padding: 28px 16px; }
      .hero { padding: 32px 20px; height: 420px; }
      .movies-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    }

    /* no-image fallback */
    .no-poster {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      gap: 8px;
    }
    .no-poster svg { width: 30px; height: 30px; opacity: 0.3; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#" onclick="showHome()">Cine<span>Vault</span></a>
  <nav>
    <button class="nav-btn active" id="btn-movies" onclick="switchTab('movies')">Movies</button>
    <button class="nav-btn" id="btn-tv" onclick="switchTab('tv')">TV Shows</button>
    <button class="nav-btn" id="btn-trending" onclick="switchTab('trending')">Trending</button>
  </nav>
  <div class="search-wrap">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search movies & shows…" oninput="debounceSearch(this.value)">
    </div>
  </div>
</header>

<!-- HERO -->
<div id="heroSection">
  <div class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-badge">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
        Now Streaming
      </div>
      <h1 id="heroTitle">Loading...</h1>
      <p id="heroOverview"></p>
      <div class="hero-actions">
        <button class="btn-primary" id="heroPlayBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M2 1l11 6-11 6z"/></svg>
          Watch Now
        </button>
        <button class="btn-secondary" id="heroInfoBtn">More Info</button>
      </div>
      <div class="hero-meta">
        <span><span class="rating-star">★</span> <span id="heroRating"></span></span>
        <span id="heroYear"></span>
        <span id="heroGenre"></span>
      </div>

  </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent">
  <div id="homeView">
    <!-- Trending Section -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">🔥 <span>Trending</span> This Week</div>
        <a class="see-all" onclick="switchTab('trending')">See All →</a>
      </div>
      <div class="movies-grid" id="trendingGrid"></div>
    </div>
    <div class="divider"></div>
    <!-- Popular Movies -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">🎬 Popular <span>Movies</span></div>
        <a class="see-all" onclick="switchTab('movies')">See All →</a>
      </div>
      <div class="movies-grid" id="moviesGrid"></div>
    </div>
    <div class="divider"></div>
    <!-- Popular TV -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">📺 Popular <span>TV Shows</span></div>
        <a class="see-all" onclick="switchTab('tv')">See All →</a>
      </div>
      <div class="movies-grid" id="tvGrid"></div>
    </div>
  </div>

  <!-- FULL SECTION VIEW -->
  <div id="sectionView" style="display:none;">
    <div class="section">
      <div class="section-header">
        <div class="section-title" id="sectionTitle"></div>
      </div>
      <div class="movies-grid" id="sectionGrid"></div>
      <div class="loading-spinner" id="sectionLoader" style="display:none;"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- SEARCH VIEW -->
  <div id="searchView" style="display:none;">
    <div class="search-results">
      <div class="search-results-title">Results for "<span id="searchQuery"></span>"</div>
      <div class="movies-grid" id="searchGrid"></div>
      <div class="loading-spinner" id="searchLoader" style="display:none;"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="divider"></div>
<footer>
  <p>CineVault — Powered by <a href="https://www.vidking.net" target="_blank">Vidking Player</a> & TMDB</p>
  <p>This site does not host any content. All media is streamed via third-party sources.</p>
</footer>

<!-- PLAYER MODAL -->
<div class="modal-bg" id="modalBg" onclick="handleModalBgClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">—</div>
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
    <div class="player-wrap">
      <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>
    <div class="modal-footer">
      <div class="modal-meta">
        <span id="modalYear"></span>
        <span id="modalRating"></span>
        <span id="modalOverview" style="max-width:500px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
      </div>
    </div>
    <!-- TV Episode Controls -->
    <div class="tv-controls" id="tvControls">
      <span class="tv-label">Season:</span>
      <select class="episode-select" id="seasonSelect" onchange="changeSeason()"></select>
      <span class="tv-label">Episode:</span>
      <div id="episodeButtons" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
  </div>
</div>

<script>
  // ---- TMDB CONFIG ----
  const TMDB_KEY = '2dca580c2a14b55200e784d157207b4d';
  const TMDB = 'https://api.themoviedb.org/3';
  const IMG = 'https://image.tmdb.org/t/p/';

  let currentTab = 'home';
  let currentMoviePage = 1;
  let currentTvPage = 1;
  let currentTrendPage = 1;
  let currentMedia = null;
  let currentSeason = 1;
  let searchTimer = null;

  // ---- HELPERS ----
  async function tmdb(path, params = {}) {
    const q = new URLSearchParams({ api_key: TMDB_KEY, ...params });
    const r = await fetch(`${TMDB}${path}?${q}`);
    return r.json();
  }

  function imgUrl(path, size = 'w342') {
    return path ? `${IMG}${size}${path}` : null;
  }

  function starRating(v) { return v ? `★ ${parseFloat(v).toFixed(1)}` : ''; }

  function makeCard(item, type) {
    const isTV = type === 'tv';
    const title = isTV ? item.name : item.title;
    const year = (isTV ? item.first_air_date : item.release_date || '').slice(0, 4);
    const poster = imgUrl(item.poster_path);
    const id = item.id;

    const div = document.createElement('div');
    div.className = 'card';
    div.onclick = () => openPlayer(id, isTV ? 'tv' : 'movie', title, item);

    div.innerHTML = `
      ${poster
        ? `<img class="card-poster" src="${poster}" alt="${title}" loading="lazy" onerror="this.outerHTML='<div class=no-poster><svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;2&quot; y=&quot;3&quot; width=&quot;20&quot; height=&quot;14&quot; rx=&quot;2&quot;/><path d=&quot;m8 21 4-4 4 4&quot;/></svg>${title}</div>'">`
        : `<div class="no-poster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/></svg>${title}</div>`
      }
      ${item.vote_average ? `<div class="card-rating">${parseFloat(item.vote_average).toFixed(1)}</div>` : ''}
      <div class="card-type-badge">${isTV ? 'TV' : 'Film'}</div>
      <div class="card-overlay">
        <div class="card-play">
          <svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg>
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${title}</div>
        <div class="card-year">${year}</div>
      </div>
    `;
    return div;
  }

  function renderSkeletons(el, count = 8) {
    el.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'skeleton skeleton-card';
      el.appendChild(d);
    }
  }

  // ---- HERO ----
  async function loadHero() {
    const data = await tmdb('/trending/movie/week');
    const pick = data.results[Math.floor(Math.random() * 5)];
    if (!pick) return;

    const backdrop = imgUrl(pick.backdrop_path, 'original');
    if (backdrop) {
      document.getElementById('heroBg').style.backgroundImage = `url(${backdrop})`;
    }
    document.getElementById('heroTitle').textContent = pick.title;
    document.getElementById('heroOverview').textContent = (pick.overview || '').slice(0, 180) + (pick.overview?.length > 180 ? '…' : '');
    document.getElementById('heroRating').textContent = parseFloat(pick.vote_average).toFixed(1);
    document.getElementById('heroYear').textContent = (pick.release_date || '').slice(0, 4);

    document.getElementById('heroPlayBtn').onclick = () => openPlayer(pick.id, 'movie', pick.title, pick);
    document.getElementById('heroInfoBtn').onclick = () => openPlayer(pick.id, 'movie', pick.title, pick);

    // Load genre
    try {
      const detail = await tmdb(`/movie/${pick.id}`);
      document.getElementById('heroGenre').textContent = (detail.genres || []).slice(0, 2).map(g => g.name).join(' · ');
    } catch(e) {}
  }

  // ---- HOME ----
  async function loadHome() {
    renderSkeletons(document.getElementById('trendingGrid'), 8);
    renderSkeletons(document.getElementById('moviesGrid'), 8);
    renderSkeletons(document.getElementById('tvGrid'), 8);

    const [trending, movies, tv] = await Promise.all([
      tmdb('/trending/all/week'),
      tmdb('/movie/popular'),
      tmdb('/tv/popular')
    ]);

    fillGrid('trendingGrid', trending.results.slice(0, 8));
    fillGrid('moviesGrid', movies.results.slice(0, 8), 'movie');
    fillGrid('tvGrid', tv.results.slice(0, 8), 'tv');
  }

  function fillGrid(gridId, items, forceType = null) {
    const g = document.getElementById(gridId);
    g.innerHTML = '';
    items.forEach(item => {
      const type = forceType || (item.media_type === 'tv' ? 'tv' : 'movie');
      g.appendChild(makeCard(item, type));
    });
  }

  // ---- TAB SWITCHING ----
  async function switchTab(tab) {
    currentTab = tab;
    ['movies','tv','trending'].forEach(t => {
      document.getElementById(`btn-${t}`)?.classList.toggle('active', t === tab);
    });

    document.getElementById('homeView').style.display = 'none';
    document.getElementById('sectionView').style.display = 'block';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('heroSection').style.display = 'none';
    document.getElementById('searchInput').value = '';

    const titles = { movies: '🎬 Popular <span>Movies</span>', tv: '📺 Popular <span>TV Shows</span>', trending: '🔥 <span>Trending</span> This Week' };
    document.getElementById('sectionTitle').innerHTML = titles[tab] || tab;

    const grid = document.getElementById('sectionGrid');
    renderSkeletons(grid, 16);

    let data;
    if (tab === 'movies') data = await tmdb('/movie/popular', { page: 1 });
    else if (tab === 'tv') data = await tmdb('/tv/popular', { page: 1 });
    else data = await tmdb('/trending/all/week', { page: 1 });

    grid.innerHTML = '';
    data.results.forEach(item => {
      const type = tab === 'movies' ? 'movie' : tab === 'tv' ? 'tv' : (item.media_type === 'tv' ? 'tv' : 'movie');
      grid.appendChild(makeCard(item, type));
    });
  }

  function showHome() {
    currentTab = 'home';
    ['movies','tv','trending'].forEach(t => document.getElementById(`btn-${t}`)?.classList.remove('active'));
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('sectionView').style.display = 'none';
    document.getElementById('searchView').style.display = 'none';
    document.getElementById('heroSection').style.display = 'block';
    document.getElementById('searchInput').value = '';
  }

  // ---- SEARCH ----
  function debounceSearch(val) {
    clearTimeout(searchTimer);
    if (!val.trim()) { showHome(); return; }
    searchTimer = setTimeout(() => doSearch(val.trim()), 350);
  }

  async function doSearch(q) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('sectionView').style.display = 'none';
    document.getElementById('heroSection').style.display = 'none';
    document.getElementById('searchView').style.display = 'block';
    document.getElementById('searchQuery').textContent = q;

    const grid = document.getElementById('searchGrid');
    renderSkeletons(grid, 12);

    const data = await tmdb('/search/multi', { query: q, include_adult: false });
    grid.innerHTML = '';
    const results = data.results.filter(r => r.media_type !== 'person' && (r.poster_path || r.title || r.name));
    if (!results.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:13px;">No results found.</p>';
      return;
    }
    results.forEach(item => {
      const type = item.media_type === 'tv' ? 'tv' : 'movie';
      grid.appendChild(makeCard(item, type));
    });
  }

  // ---- PLAYER ----
  async function openPlayer(id, type, title, item) {
    currentMedia = { id, type, title, item };
    currentSeason = 1;

    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalYear').textContent = (item.release_date || item.first_air_date || '').slice(0,4);
    document.getElementById('modalRating').textContent = item.vote_average ? `★ ${parseFloat(item.vote_average).toFixed(1)}` : '';
    document.getElementById('modalOverview').textContent = item.overview || '';

    if (type === 'movie') {
      setPlayerSrc(`https://www.vidking.net/embed/movie/${id}`);
      document.getElementById('tvControls').classList.remove('show');
    } else {
      // Load TV seasons
      await loadTVSeasons(id);
      document.getElementById('tvControls').classList.add('show');
    }

    document.getElementById('modalBg').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  async function loadTVSeasons(id) {
    try {
      const detail = await tmdb(`/tv/${id}`);
      const seasons = (detail.seasons || []).filter(s => s.season_number > 0);

      const sel = document.getElementById('seasonSelect');
      sel.innerHTML = seasons.map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');

      await loadEpisodes(id, 1);
    } catch(e) {
      setPlayerSrc(`https://www.vidking.net/embed/tv/${id}/1/1`);
      renderEpisodeButtons(10, id, 1);
    }
  }

  async function loadEpisodes(id, season) {
    currentSeason = season;
    try {
      const detail = await tmdb(`/tv/${id}/season/${season}`);
      const episodes = detail.episodes || [];
      renderEpisodeButtons(episodes.length, id, season, 1);
      setPlayerSrc(`https://www.vidking.net/embed/tv/${id}/${season}/1`);
    } catch(e) {
      renderEpisodeButtons(12, id, season, 1);
      setPlayerSrc(`https://www.vidking.net/embed/tv/${id}/${season}/1`);
    }
  }

  function renderEpisodeButtons(count, id, season, activeEp = 1) {
    const wrap = document.getElementById('episodeButtons');
    wrap.innerHTML = '';
    for (let i = 1; i <= Math.min(count, 30); i++) {
      const btn = document.createElement('button');
      btn.className = 'episode-btn' + (i === activeEp ? ' active' : '');
      btn.textContent = `E${i}`;
      btn.onclick = () => {
        document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setPlayerSrc(`https://www.vidking.net/embed/tv/${id}/${season}/${i}`);
      };
      wrap.appendChild(btn);
    }
  }

  async function changeSeason() {
    const season = parseInt(document.getElementById('seasonSelect').value);
    if (!currentMedia) return;
    await loadEpisodes(currentMedia.id, season);
  }

  function setPlayerSrc(src) {
    document.getElementById('playerFrame').src = src;
  }

  function closeModal() {
    document.getElementById('modalBg').classList.remove('open');
    document.getElementById('playerFrame').src = '';
    document.body.style.overflow = '';
  }

  function handleModalBgClick(e) {
    if (e.target === document.getElementById('modalBg')) closeModal();
  }

  // Escape key
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ---- INIT ----
  loadHero();
  loadHome();
</script>
</body>
</html>
